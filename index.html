<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Naga Marn</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    .links {
      margin-top: 25px;
    }

    .links a {
      display: inline-block;
      margin: 8px;
      padding: 10px 18px;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      text-decoration: none;
      transition: 0.3s;
    }

    .links a:hover {
      background: #1e293b;
      border-color: #64748b;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Naga Marn</h1>
    <p>
      Senior Data Engineering & Data Governance leader focused on building
      scalable data platforms, improving customer experience, and driving
      business outcomes through analytics and trusted data.
    </p>

    <div class="links">
      <a href="https://www.linkedin.com/in/nagamarn" target="_blank">LinkedIn</a>
      <a href="mailto:your.email@example.com">Email</a>
      <a href="#">Projects</a>
      <a href="#">Resume</a>
    </div>

    <footer>
      © <span id="year"></span> Naga Marn. All rights reserved.
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
